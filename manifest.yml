---
applications:
  - name: sap-cpi-mcp-server
    memory: 256M
    disk_quota: 512M
    instances: 1
    buildpacks:
      - nodejs_buildpack
    command: node src/index.js
    env:
      MCP_TRANSPORT: http
      # --- Set these to your CPI service-key values (or use `cf set-env`) ---
      # CPI_BASE_URL: https://<tenant>.it-cpiXXX.cfapps.<region>.hana.ondemand.com/api/v1
      # CPI_TOKEN_URL: https://<subdomain>.authentication.<region>.hana.ondemand.com/oauth/token
      # CPI_CLIENT_ID: <clientid-from-service-key>
      # CPI_CLIENT_SECRET: <clientsecret-from-service-key>
      # Optional: protect the /mcp endpoint with a shared bearer token.
      # MCP_AUTH_TOKEN: <a-long-random-secret>
      #
      # --- Or keep CPI_CLIENT_SECRET out of this file/VCAP entirely (see src/credStore.js) ---
      # Bind a Credential Store instance below, store the real secret there, and set this
      # instead of CPI_CLIENT_SECRET — the app resolves it via the bound service's
      # credentials at runtime, so the actual CPI secret never sits in manifest.yml/`cf env`:
      # CPI_CREDSTORE_KEY: cpi-oauth-secret
      # CPI_CREDSTORE_NAMESPACE: cpi-mcp   # optional, defaults to "cpi-mcp"
    #
    # Bound below — requires CPI_CREDSTORE_KEY above to be set for whichever tenant
    # should use it. CF injects rotating access credentials into VCAP_SERVICES
    # (Basic-auth username/password on trial-plan instances, or an x509 client cert on
    # plans configured for mTLS — src/credStore.js handles either).
    #
    # Alternative to Credential Store: a user-provided service (still plaintext, but out
    # of manifest.yml/CI history). Only use this INSTEAD of cpi-credstore below, not
    # alongside it — create it first with:
    #   cf cups cpi-credentials -p '{"clientId":"...","clientSecret":"..."}'
    # services:
    #   - cpi-credentials
    #services:
      #- cpi-credstore
